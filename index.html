<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSS REFERA</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}
.header{
    background:#111827;
    color:white;
    padding:25px 20px;
    text-align:center;
}
.header h1{margin:0;font-size:30px;}
.header p{margin:8px 0 0;}
.container{
    max-width:500px;
    margin:30px auto;
    padding:20px;
}
.card{
    background:white;
    padding:22px;
    margin-bottom:18px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}
h2{margin-top:0;}
input{
    width:100%;
    padding:13px;
    margin:8px 0;
    box-sizing:border-box;
    border:1px solid #ddd;
    border-radius:8px;
}
button{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
}
.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
.stat{
    background:#eef2ff;
    padding:18px;
    text-align:center;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="header">
    <h1>TSS REFERA</h1>
    <p>Referral • Network • Growth Platform</p>
</div>

<div class="container">

<div class="card">
    <h2>Welcome</h2>
    <p>Build Teams • Grow Together</p>
</div>

<div class="card">
    <h2>Login</h2>
    <input type="text" placeholder="Mobile Number">
    <input type="password" placeholder="Password">
    <button>Login</button>
</div>

<div class="card">
    <h2>Dashboard Preview</h2>

    <div class="stats">
        <div class="stat">
            <b>0</b><br>Direct Members
        </div>
        <div class="stat">
            <b>0</b><br>Total Team
        </div>
        <div class="stat">
            <b>0</b><br>Rewards
        </div>
        <div class="stat">
            <b>TSS001</b><br>Referral Code
        </div>
    </div>
</div>

</div>

</body>
</html>
